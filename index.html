<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ufak Bir Soru...</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            overflow: hidden; /* Buton ekran dışına taşarsa kaydırma çubuklarını gizler */
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            gap: 20px;
            position: relative; /* Butonların başlangıç konumu için */
        }

        button {
            padding: 12px 24px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        #btn-evet {
            background-color: #4CAF50;
            color: white;
        }

        #btn-evet:hover {
            transform: scale(1.1);
        }

        #btn-hayir {
            background-color: #f44336;
            color: white;
            position: relative; /* İlk başta normal durması için */
        }
    </style>
</head>
<body>

    <h1>NUDE ATIYOR MUSUN?</h1>
    
    <div class="buttons">
        <button id="btn-evet" onclick="alert('Harika! O ZAMAN WHATSAPPTA BEKLİYORUM 😋')">Tabii ki!</button>
        <button id="btn-hayir">Hayır</button>
    </div>

    <script>
        const btnHayir = document.getElementById('btn-hayir');

        // Fare butonun üzerine geldiğinde çalışacak fonksiyon
        btnHayir.addEventListener('mouseover', function() {
            // Pencere boyutlarını al
            const xMax = window.innerWidth - btnHayir.offsetWidth;
            const yMax = window.innerHeight - btnHayir.offsetHeight;

            // Rastgele X ve Y koordinatları üret
            const rastgeleX = Math.floor(Math.random() * xMax);
            const rastgeleY = Math.floor(Math.random() * yMax);

            // Butonu sayfadan bağımsız hareket edebilmesi için 'fixed' yap
            btnHayir.style.position = 'fixed';
            btnHayir.style.left = rastgeleX + 'px';
            btnHayir.style.top = rastgeleY + 'px';
        });
    </script>

</body>
</html>
