<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seni Çok Seviyorum 🥺</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #ffe6e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Buton kaçarken ekran kaymasın diye */
        }
        .container {
            text-align: center;
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            z-index: 10;
        }
        h1 {
            color: #ff4d4d;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 1.2em;
            margin-bottom: 30px;
        }
        .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        button {
            padding: 12px 40px;
            font-size: 1.2em;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s;
        }
        #evet {
            background-color: #ff4d4d;
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 77, 0.4);
        }
        #evet:hover {
            transform: scale(1.1);
        }
        #hayir {
            background-color: #666;
            color: white;
        }
        .heart {
            font-size: 60px;
            animation: heartbeat 1s infinite alternate;
            margin-bottom: 10px;
        }
        @keyframes heartbeat {
            from { transform: scale(1); }
            to { transform: scale(1.2); }
        }
        .hidden {
            display: none;
        }
        
        /* Ekstra tatlılık için arkaya uçuşan kalpler eklenebilir ama sade tuttuk */
    </style>
</head>
<body>

    <!-- İLK EKRAN: SORU KISMI -->
    <div class="container" id="soru-ekrani">
        <div class="heart">❤️</div>
        <h1>Beni affettin mi? 🥺</h1>
        <p>Seni ne kadar çok sevdiğimi biliyorsun. Lütfen barışalım...</p>
        <div class="buttons">
            <button id="evet" onclick="baristik()">Evet!</button>
            <button id="hayir" onmouseover="kac(this)" onclick="kac(this)">Hayır</button>
        </div>
    </div>

    <!-- İKİNCİ EKRAN: KUTLAMA KISMI -->
    <div class="container hidden" id="mutlu-son">
        <div class="heart" style="font-size: 80px;">💖</div>
        <h1>Biliyordum! 😍</h1>
        <p>Seni dünyalar kadar seviyorum! Hemen bana mesaj at!</p>
    </div>

    <script>
        // Hayır butonunu kaçıran fonksiyon
        function kac(btn) {
            // Butonu ekranda rastgele bir yere taşı
            const x = Math.random() * (window.innerWidth - btn.offsetWidth - 50);
            const y = Math.random() * (window.innerHeight - btn.offsetHeight - 50);
            
            btn.style.position = 'fixed';
            btn.style.left = `${Math.max(20, x)}px`;
            btn.style.top = `${Math.max(20, y)}px`;
        }

        // Evet butonuna basılınca çalışacak fonksiyon
        function baristik() {
            document.getElementById('soru-ekrani').classList.add('hidden');
            document.getElementById('mutlu-son').classList.remove('hidden');
        }
    </script>

</body>
</html>
